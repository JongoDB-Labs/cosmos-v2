# ─────────────────────────────────────────────────────────────────────────────
# cosmos chart — default (medium) values. Override with values-small/large.yaml
# (sizing) and values-posture-dod.yaml (hardening). Component sections (postgres,
# minio, …) are filled in task-by-task as we add each template.
# ─────────────────────────────────────────────────────────────────────────────

# Images are DIGEST-pinned to the cosign-verified 2.102.2 release (multi-arch index
# digest — containerd resolves amd64 on RKE2, arm64 elsewhere). Tag→digest is the
# supply-chain guarantee from the signing pipeline; the chart inherits it.
image:
  app:
    repo: ghcr.io/jongodb-labs/cosmos-v2
    digest: "sha256:62275339aa9372b837f6376d26b890238a7d8f7b035b03af91f777419e0d3361"
  migrate:
    repo: ghcr.io/jongodb-labs/cosmos-v2-migrate
    digest: "sha256:b1294c50d9590beb9f784852a9c07423c5814df9fbc50c39890036eb252a41a6"
  pullPolicy: IfNotPresent

# App workload sizing (small/large profiles override these).
app:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# Security posture: baseline | dod. The dod overlay flips FIPS, strict netpol,
# 1095-day audit retention, external S3, registry1 (Iron Bank) images, enforced SSO.
posture: baseline

# Istio exposure via the UDS Package CR (host under the tenant gateway).
# `host`.`domain` = the external FQDN the app is reached at (e.g. cosmos.uds.dev);
# `domain` must match the UDS cluster domain (UDS_DOMAIN, default uds.dev).
expose:
  host: cosmos
  domain: uds.dev

# App-level SSO (server-side OIDC) against the substrate Keycloak. When enabled, the
# UDS Package creates the Keycloak client + a secret, and the chart adds the egress
# allow the app needs to reach Keycloak (UDS does NOT auto-add it — see uds-package.yaml).
# The IdpConnection row (which actually turns login on for an org) is written by the
# `prisma/seed/wire-keycloak-idp.ts` seed, sealing this client's secret into the DB.
# Inside the cluster the issuer's host name resolves to a private address, which the
# app refuses unless it is listed in `allowPrivateCidrs` here.
sso:
  enabled: true
  clientId: cosmos-acme            # the Keycloak client (realm `uds`)
  name: "COSMOS — acme (demo)"     # human label shown in Keycloak
  orgSlug: acme                    # the cosmos org this client logs into (redirect path + seed)
  secretName: cosmos-sso-acme      # k8s Secret the UDS operator writes the client creds to
  # Private networks an org's SSO issuer may be on. Sets SSO_ALLOW_PRIVATE_CIDRS
  # (docs/runbooks/outbound-endpoints.md). Comma-separated CIDR ranges, e.g.
  # "10.43.12.34/32,fd12:3456::/48". Empty (the default) sets nothing, so an issuer
  # must be public. List only the narrowest range that holds the issuer, e.g. the
  # address its host name resolves to from the app pod, as a /32. Only SSO reads this
  # list: it never opens a range to the endpoints org admins configure (`outbound`
  # below), and link-local and cloud metadata addresses stay unreachable whatever is
  # listed.
  allowPrivateCidrs: ""

# Private networks the endpoints org admins configure may be on: the OpenAI-compatible
# model, Jira and MCP endpoints. Sets OUTBOUND_ALLOW_PRIVATE_CIDRS
# (docs/runbooks/outbound-endpoints.md). Comma-separated CIDR ranges, as above. Empty
# (the default) sets nothing, so those endpoints must be public. Every org admin's
# endpoints can then reach these ranges, so list only the narrowest that hold the
# services. SSO issuers never use this list (`sso.allowPrivateCidrs` above), nor do
# webhooks or Cosmo's fetch_url, and link-local and cloud metadata addresses stay
# unreachable whatever is listed.
outbound:
  allowPrivateCidrs: ""

# Where the app keeps uploaded files: `s3` (the MinIO below; the default) or `azure`
# (Azure Blob Storage). `azure` needs app image 2.564.0 or later: the chart released
# with each version pins its own image, but the `image` pin in this source file can
# be older, so when installing from source set `image.app.digest` and
# `image.migrate.digest` to the same release. MinIO is deployed either way: the backup and audit buckets
# live there. Switching an existing install needs a pause in uploads: stop the app,
# copy its objects to the new store under the SAME keys, then switch, or files
# uploaded meanwhile (or not copied) will 404.
storage:
  adapter: s3
  azure:
    # Must already exist: the app does not create it.
    container: cosmos-uploads
    # A bare https endpoint, e.g. https://<account>.blob.core.windows.net (no SAS, no
    # path). The app signs in with AKS workload identity, so no secret is stored.
    # Requires `workloadIdentity.clientId`.
    accountUrl: ""
    # AKS workload identity: the client ID of the user-assigned managed identity the
    # app signs in as. The chart creates the ServiceAccount `cosmos` (annotated with
    # this ID) and labels the app pods so AKS injects the token. That identity needs
    # "Storage Blob Data Contributor" on the account, and a federated credential for
    # subject system:serviceaccount:<namespace>:cosmos. The app pods then run as that
    # ServiceAccount, not `default`: if your image pull secret is on `default`, add it
    # to `cosmos` too.
    workloadIdentity:
      clientId: ""
    # Instead of an identity: the name of a Secret whose key
    # AZURE_STORAGE_CONNECTION_STRING holds a connection string (for the Azurite
    # emulator, or an account with shared keys on). When set, `accountUrl` and
    # workload identity are not used.
    connectionStringSecret: ""
    # Under UDS (default-deny network): true adds an egress for the web pods to any
    # address on 443, which Blob and Microsoft Entra ID sign-in need. That also opens
    # every other outbound HTTPS call from those pods, so it is off by default; turn
    # it on, or allow that egress some narrower way (e.g. a UDS `remoteHost` rule).
    udsEgress: false

# Object storage — single-instance MinIO for the lab (MinIO Operator / external
# GovCloud S3 is the prod path per north-star §2). Creds live in a Secret,
# SOPS-managed from T4 (created out-of-band for now).
minio:
  image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
  mcImage: minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
  credsSecret: cosmos-minio-creds
  storage: 10Gi
  wormRetentionDays: 3650
  buckets:
    uploads: cosmos-uploads
    backups: cosmos-pgbackrest
    auditWorm: cosmos-audit-worm

# PostgresCluster (CrunchyData PGO). pgvector ships in the crunchy-postgres image.
postgres:
  version: 16
  instances: 1
  storage: 5Gi
  backupStorage: 5Gi
  psqlImage: postgres:16-alpine   # migrate hook's create-app-role init container (needs psql)
  # pgBackRest repo2 = MinIO Operator Tenant S3 over TLS, ALONGSIDE the local repo1.
  # When enabled, the chart adds repo2 to the PostgresCluster + a cosmos->minio egress
  # (uds-package.yaml). Requires: the MinIO Tenant (S3 at endpoint below) + the SOPS
  # secret `secretName` holding `s3.conf` (repo2-s3-key/secret) + `ca.crt` (the Tenant
  # CA = cluster CA). endpoint is the Tenant Service host (HTTPS:443; pgBackRest S3 is
  # always TLS). NOTE the egress to ns minio must be PORTLESS — the Tenant Service is
  # 443->targetPort 9000, so a port-443 netpol drops post-DNAT (runbook gotcha #15).
  backups:
    s3:
      enabled: false
      bucket: cosmos-pgbackrest
      endpoint: minio.minio.svc          # MinIO Operator Tenant Service (ns minio)
      region: us-east-1                  # required by the S3 API; MinIO ignores it
      secretName: cosmos-pgbackrest-s3
      schedules:
        full: "0 1 * * 0"                # weekly full (Sun 01:00)
        incremental: "0 1 * * 1-6"       # daily incremental

# Gov audit/compliance ops (SP3) — CronJobs/Jobs on the migrate image (carries
# scripts/dsop/*), connecting over the same verified PGO TLS as the app.
ops:
  verifyAuditChain:
    schedule: "0 */6 * * *"        # AU-9 tamper-evidence — every 6h
