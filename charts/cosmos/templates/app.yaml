{{/*
The cosmos app — Next.js standalone. Runs as the non-root `cosmos` user from the
image (UDS-compliant). Connects to Postgres as the least-priv cosmos_app role, to
MinIO for S3, and reads SSO/WORM secrets from the SOPS-managed secret.
Distinct `component: web` labels avoid colliding with MinIO's selector.
Uploads go to MinIO or Azure Blob, per `storage.adapter` (values.yaml).
*/}}
{{- $st := .Values.storage | default dict }}
{{- $adapter := "s3" }}
{{- if not (kindIs "invalid" $st.adapter) }}{{ $adapter = toString $st.adapter }}{{ end }}
{{- $az := $st.azure | default dict }}
{{- $wiClientId := ($az.workloadIdentity | default dict).clientId }}
{{- if not (has $adapter (list "s3" "azure")) }}
{{- fail (printf "storage.adapter must be s3 or azure, got %q" $adapter) }}
{{- end }}
{{- /* Workload identity is used only when the app signs in with an identity (no connection string). */}}
{{- $useWI := false }}
{{- if eq $adapter "azure" }}
{{- if not $az.container }}
{{- fail "storage.adapter=azure needs storage.azure.container" }}
{{- end }}
{{- if not $az.connectionStringSecret }}
{{- if not $az.accountUrl }}
{{- fail "storage.adapter=azure needs storage.azure.accountUrl (with workloadIdentity.clientId) or storage.azure.connectionStringSecret" }}
{{- end }}
{{- if not (regexMatch "^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$" (toString $az.accountUrl)) }}
{{- fail "storage.azure.accountUrl must be a bare https account endpoint, e.g. https://<account>.blob.core.windows.net (no path, query or credentials; value withheld)" }}
{{- end }}
{{- if not $wiClientId }}
{{- fail "storage.azure.accountUrl needs storage.azure.workloadIdentity.clientId: without it the pod would fall back to the node's identity" }}
{{- end }}
{{- $useWI = true }}
{{- end }}
{{- end }}
{{- if $useWI }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmos
  labels: {{- include "cosmos.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ $wiClientId | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos
  labels: {{- include "cosmos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: web
        {{- if $useWI }}
        # AKS injects the workload identity token into pods with this label.
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if $useWI }}
      annotations:
        # AKS sets the client ID when a pod starts; a new ID rolls the pods.
        cosmos.dev/azure-client-id: {{ $wiClientId | quote }}
      {{- end }}
    spec:
      {{- if $useWI }}
      serviceAccountName: cosmos
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cosmos
          image: "{{ .Values.image.app.repo }}@{{ .Values.image.app.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: COSMOS_APP_PASSWORD, valueFrom: { secretKeyRef: { name: cosmos-app-secrets, key: COSMOS_APP_PASSWORD } } }
            # k8s substitutes $(COSMOS_APP_PASSWORD) from the env above
            - { name: DATABASE_URL, value: "postgresql://cosmos_app:$(COSMOS_APP_PASSWORD)@cosmos-pg-primary.cosmos.svc:5432/cosmos?sslmode=require&sslrootcert=/etc/pg-ca/ca.crt" }
            - { name: DIRECT_URL,  value: "postgresql://cosmos_app:$(COSMOS_APP_PASSWORD)@cosmos-pg-primary.cosmos.svc:5432/cosmos?sslmode=require&sslrootcert=/etc/pg-ca/ca.crt" }
            - { name: STORAGE_ADAPTER, value: {{ $adapter | quote }} }
            {{- if eq $adapter "azure" }}
            - { name: AZURE_STORAGE_CONTAINER, value: {{ $az.container | quote }} }
            {{- if $az.connectionStringSecret }}
            - { name: AZURE_STORAGE_CONNECTION_STRING, valueFrom: { secretKeyRef: { name: {{ $az.connectionStringSecret | quote }}, key: AZURE_STORAGE_CONNECTION_STRING } } }
            {{- else }}
            - { name: AZURE_STORAGE_ACCOUNT_URL, value: {{ $az.accountUrl | quote }} }
            # Sign in only with AKS workload identity: never fall back to the node's identity.
            - { name: AZURE_TOKEN_CREDENTIALS, value: WorkloadIdentityCredential }
            {{- end }}
            {{- else }}
            - { name: S3_ENDPOINT, value: "http://minio.cosmos.svc:9000" }
            - { name: S3_BUCKET, value: {{ .Values.minio.buckets.uploads | quote }} }
            - { name: S3_FORCE_PATH_STYLE, value: "true" }
            - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.minio.credsSecret }}, key: S3_ACCESS_KEY } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.minio.credsSecret }}, key: S3_SECRET_KEY } } }
            {{- end }}
            - { name: SSO_VAULT_KEY, valueFrom: { secretKeyRef: { name: cosmos-app-secrets, key: SSO_VAULT_KEY } } }
            - { name: WORM_MANIFEST_HMAC_KEY, valueFrom: { secretKeyRef: { name: cosmos-app-secrets, key: WORM_MANIFEST_HMAC_KEY } } }
            - { name: INTERNAL_ADMINS, valueFrom: { secretKeyRef: { name: cosmos-app-secrets, key: INTERNAL_ADMINS } } }
            {{- with .Values.sso.allowPrivateCidrs }}
            # Private ranges an org's SSO issuer may be on, for SSO only (values.yaml `sso`).
            - { name: SSO_ALLOW_PRIVATE_CIDRS, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.outbound.allowPrivateCidrs }}
            # Private ranges the endpoints org admins configure may be on (values.yaml `outbound`).
            - { name: OUTBOUND_ALLOW_PRIVATE_CIDRS, value: {{ . | quote }} }
            {{- end }}
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: pg-ca, mountPath: /etc/pg-ca, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            secretName: cosmos-pg-cluster-cert
            items:
              - { key: ca.crt, path: ca.crt }
---
apiVersion: v1
kind: Service
metadata:
  name: cosmos
  labels: {{- include "cosmos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
