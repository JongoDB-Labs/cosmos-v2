# Security gates — CMMC L2 / NIST 800-171 audit-ready evidence pipeline.
#
# Each gate maps to spec §8.1 control IDs (in the job comment) and emits a
# report into evidence/<sha>/ uploaded as a workflow artifact. fail-on-Critical
# where the spec marks the gate HARD; IaC is Info for now.
#
# All `uses:` are pinned to a commit SHA (human version in trailing comment) —
# the config-assertions gate below FAILS the build if any @vN/@main ref remains
# in .github/** (including this file and ci.yml). That gate is the load-bearing
# enforcement of spec §8 gate 8.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly-disclosed CVEs in unchanged deps still surface.
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# See ci.yml for the full rationale: onnxruntime-node's postinstall pulls 301MB of
# CUDA/TensorRT execution providers from api.nuget.org on linux/x64 only, we run CPU-only
# inference, and an api.nuget.org outage otherwise fails `npm ci` outright.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Gate 1 — SAST. 800-171 3.11.2 / 3.14.1
  codeql:
    name: SAST (CodeQL JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF → code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # init and analyze MUST stay on the same version. CodeQL's analyze step
      # reads the config init wrote and refuses a mismatch ("Loaded a
      # configuration file for version X, but running version Y"), so bumping
      # one without the other fails the job. Dependabot raises them as two
      # separate PRs (#476 init, #475 analyze), each of which is red on its own
      # for exactly that reason — they have to land together.
      - name: Init CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
          output: evidence/${{ github.sha }}
      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: evidence/${{ github.sha }}/*.sarif
          if-no-files-found: ignore

  # Gate 2 — SCA / deps. 800-171 3.11.2  (HARD on Critical; High → POA&M)
  sca:
    name: SCA (OSV-Scanner + Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: mkdir -p evidence/${{ github.sha }}

      # OSV-Scanner over the lockfile.
      - name: OSV-Scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true # report captured below; HARD failure is Trivy's job
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=json
            --output=evidence/${{ github.sha }}/osv.json

      # Trivy filesystem scan — HARD fail on Critical, High recorded (POA&M).
      - name: Trivy fs (record High; fail on Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: evidence/${{ github.sha }}/trivy-fs.json
          severity: HIGH,CRITICAL
          exit-code: "0" # record-only here; the HARD gate is the next step
      - name: Fail on Critical (Trivy fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL
          exit-code: "1" # HARD: any Critical fails the build
      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sca-reports
          path: evidence/${{ github.sha }}/{osv,trivy-fs}.json
          if-no-files-found: warn

  # Gate 3 — Secret scan. 800-171 3.5.1 / 3.5.2  (HARD — any finding fails)
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - run: mkdir -p evidence/${{ github.sha }}
      # gitleaks via the pinned, checksum-verified CLI. The gitleaks-action
      # wrapper now REQUIRES a paid license for org-owned repos ("[JongoDB-Labs]
      # is an organization. License key is required."); the MIT-licensed CLI
      # does not. Pinning the version + the SHA-256 of the release asset keeps
      # the supply-chain integrity the action's SHA-pin used to give (spec §8 g.3).
      - name: gitleaks (pinned CLI)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # HARD gate: non-zero exit if any secret is detected (--exit-code 1).
          ./gitleaks git . --no-banner --redact --exit-code 1 \
            --report-format json \
            --report-path "evidence/${{ github.sha }}/gitleaks.json"
          rm -f gitleaks gitleaks.tar.gz
      - name: Upload gitleaks evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: evidence/${{ github.sha }}/gitleaks.json
          if-no-files-found: ignore

  # Gate 4 — Image vuln scan. 800-171 3.11.2  (HARD on Critical)
  # Builds the runtime image locally (no GHCR push needed for the scan) and
  # scans by image. Post Phase-3 collapse there is a SINGLE cosmos-v2 image that
  # serves every product (product = runtime env), so scanning it covers all
  # deployments — no separate per-product image to scan. In a remote-connected repo
  # this would scan the pushed digest from release.yml; here it is self-contained.
  image-scan:
    name: Image scan (Trivy image)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: mkdir -p evidence/${{ github.sha }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Derive VERSION
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build runtime image (load to daemon)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          # Authenticate the Dockerfile's MiniLM download (see release.yml / Dockerfile)
          # so this scan's fresh image build isn't rate-limited on HF's anonymous IP cap.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: cosmos-v2:${{ steps.version.outputs.version }}
      - name: Trivy image (record High; report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cosmos-v2:${{ steps.version.outputs.version }}
          format: json
          output: evidence/${{ github.sha }}/trivy-image.json
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Fail on Critical (Trivy image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cosmos-v2:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          exit-code: "1" # HARD
      - name: Upload image-scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report
          path: evidence/${{ github.sha }}/trivy-image.json
          if-no-files-found: ignore

  # Gate 5 — IaC / Dockerfile. 800-171 3.4.1 / 3.4.2  (Info now)
  iac:
    name: IaC (hadolint + Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: mkdir -p evidence/${{ github.sha }}
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        continue-on-error: true # Info: surfaced, never blocks (spec §8 gate 5)
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: evidence/${{ github.sha }}/hadolint.sarif
          no-fail: true
      - name: Checkov (compose + manifests)
        uses: bridgecrewio/checkov-action@fa9edf8f0a491c59a924ea6accd5bdcf07752cff # v12.3107.0
        continue-on-error: true # Info
        with:
          directory: .
          output_format: sarif
          output_file_path: evidence/${{ github.sha }}/checkov.sarif
          soft_fail: true
      - name: Upload IaC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iac-reports
          path: evidence/${{ github.sha }}/{hadolint,checkov}.sarif
          if-no-files-found: ignore

  # Gate 8 — Config assertions. 800-171 3.1.1 / 3.4.x  (HARD)
  #   (a) every action ref in .github/** is SHA-pinned (no mutable tag refs)
  #   (b) E2E_TEST_AUTH is not set to "1" in any release/prod env
  #   (c) control-coverage gate (script authored by Task 3 — call it)
  config-assertions:
    name: Config assertions (pin + env + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: mkdir -p evidence/${{ github.sha }}

      # (a) SHA-pin assertion. A bare `# TODO-PIN:` marker is tolerated (an
      # explicitly-tracked, not-yet-resolved pin), but a live @vN/@main/@master
      # ref fails the build.
      - name: Assert all actions are SHA-pinned
        run: |
          set -euo pipefail
          echo "Scanning .github/ for unpinned action refs..." | tee evidence/${{ github.sha }}/config-asserts.txt
          # Strip trailing comments before matching so `# v4.2.2` version
          # comments never false-positive; then flag any @vN/@main/@master.
          UNPINNED="$(grep -rnE 'uses:' .github/ \
            | sed -E 's/#.*$//' \
            | grep -vE 'TODO-PIN' \
            | grep -nE 'uses:.*@(v[0-9]|main|master)([^0-9a-zA-Z]|$)' || true)"
          if [ -n "$UNPINNED" ]; then
            {
              echo "FAIL: unpinned action refs found (must be @<40-char-sha>):"
              echo "$UNPINNED"
            } | tee -a evidence/${{ github.sha }}/config-asserts.txt
            exit 1
          fi
          echo "PASS: all actions SHA-pinned" | tee -a evidence/${{ github.sha }}/config-asserts.txt

      # (b) E2E_TEST_AUTH must never be "1" in the release/prod path. ci.yml's
      # e2e jobs legitimately set it (test runners), so this asserts it is NOT
      # present in release.yml (the prod-image build/publish path).
      - name: Assert CHANGELOG is current (What's-new per release)
        run: |
          set -euo pipefail
          # `grep -m1` rather than `grep | head -1`: head closes the pipe after one
          # line, the upstream grep gets EPIPE on its next write, and `set -o
          # pipefail` turns that into a failed step. It is size-dependent — with
          # 225+ changelog entries grep now has plenty left to write when head
          # exits — so this surfaced as a mysterious "Config assertions" failure
          # on a PR whose versions were perfectly correct. -m1 stops grep itself,
          # so nothing is left to write and there is no pipe to break.
          PKG="$(grep -m1 -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          TOP="$(grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' src/lib/changelog.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ "$PKG" != "$TOP" ]; then
            echo "FAIL: CHANGELOG top ($TOP) != package.json version ($PKG) - every release must add a Whats-new entry" | tee -a evidence/${{ github.sha }}/config-asserts.txt
            exit 1
          fi
          echo "PASS: CHANGELOG top matches $PKG" | tee -a evidence/${{ github.sha }}/config-asserts.txt

      # Assert: a PR that changes SHIPPABLE code also bumps the version.
      #
      # WHY. auto-tag-release tags main only when package.json's version has no
      # tag yet. A PR that changes src/ but leaves the version alone therefore
      # merges green, creates no tag, runs no release, publishes no image — and
      # the hourly image-freshness check stays green too, because the latest core
      # tag never moved. The fix sits on main looking merged while every deployed
      # instance keeps the old build. That is not hypothetical: #638 (self-hosted
      # fonts) and #637 (ten dependency updates) both arrived this way on
      # 2026-08-10, and dependabot produces it BY DEFAULT since it never touches
      # `version`.
      #
      # Scoped to paths that actually reach the image. Docs, CI config, tests and
      # e2e specs are excluded — they change nothing a user runs, and failing
      # those would train people to ignore this gate.
      - name: Assert a shippable change also bumps the version
        if: github.event_name == 'pull_request'
        # Via env rather than inlined into the script. `base_ref` is our own target
        # branch and not attacker-controlled (unlike `head_ref`, which a fork PR
        # names freely), but the env form is the documented-safe shape for any
        # `github.*` value reaching a shell and costs nothing.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # This job checks out at the default fetch-depth of 1, so there is NO
          # merge base here: a three-dot `base...HEAD` diff cannot work. Fetch the
          # base tip shallowly and use a TWO-dot diff, which compares the two trees
          # directly and needs no common ancestor. On a pull_request event
          # actions/checkout gives refs/pull/N/merge — base already merged into
          # head — so `base HEAD` is exactly this PR's effective change.
          git fetch --quiet --depth=1 origin "$BASE_REF"
          BASE=FETCH_HEAD

          # Files that end up in the running product. package.json/-lock count:
          # a dependency change ships even when no source line moves.
          #
          # plugins.lock.json is here for the same reason and was MISSED on the
          # first pass: it pins the plugin commits the assembly composes, so
          # changing it changes what the image contains — adding a whole plugin,
          # in the case that caught this — while touching no file under `plugins`
          # (the composed directory, which is gitignored in the public core and
          # does not match this path anyway).
          CHANGED="$(git diff --name-only "$BASE" HEAD -- \
            src prisma public plugins plugins.lock.json Dockerfile next.config.ts \
            package.json package-lock.json \
            | grep -vE '(\.test\.[tj]sx?|\.spec\.[tj]sx?|__tests__/)' || true)"

          if [ -z "$CHANGED" ]; then
            echo "PASS: no shippable paths changed - version bump not required" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            exit 0
          fi

          HEAD_V="$(grep -m1 -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          BASE_V="$(git show "$BASE:package.json" | grep -m1 -oE '"version": "[0-9]+\.[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"

          if [ "$HEAD_V" = "$BASE_V" ]; then
            echo "FAIL: shippable files changed but package.json is still $BASE_V." \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            echo "      Merging this would create no tag, so no release and no image would be built," \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            echo "      and nothing would report it. Run: npm run release:bump <next-version>" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            echo "      and add the matching src/lib/changelog.ts entry." \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            echo "      Changed: $(echo "$CHANGED" | tr '\n' ' ')" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            exit 1
          fi
          echo "PASS: version bumped $BASE_V -> $HEAD_V for a shippable change" \
            | tee -a evidence/${{ github.sha }}/config-asserts.txt

      - name: Assert E2E_TEST_AUTH != 1 in release path
        run: |
          set -euo pipefail
          if grep -nE 'E2E_TEST_AUTH:\s*"?1"?' .github/workflows/release.yml; then
            echo "FAIL: E2E_TEST_AUTH=1 set in release.yml (prod publish path)" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
            exit 1
          fi
          echo "PASS: E2E_TEST_AUTH not enabled in release path" \
            | tee -a evidence/${{ github.sha }}/config-asserts.txt
          # Also assert the runtime image hard-codes NODE_ENV=production (the
          # testenv route's prod-404 belt). Defense in depth for (c).
          if grep -qE 'ENV[[:space:]].*NODE_ENV=production' Dockerfile; then
            echo "PASS: Dockerfile pins NODE_ENV=production (testenv route inert)" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
          else
            echo "WARN: Dockerfile does not pin NODE_ENV=production" \
              | tee -a evidence/${{ github.sha }}/config-asserts.txt
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      # (c) Living-SSP control-coverage gate (script authored by Task 3).
      - name: Control coverage gate
        run: npm run check:control-coverage

      - name: Upload config-assertion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: config-asserts
          path: evidence/${{ github.sha }}/config-asserts.txt
          if-no-files-found: ignore
