name: feedback-remediation

# Auto-remediation loop (FR 695aa097) — the scheduled poller. Calls the org's
# remediation trigger endpoint, which delivers OPEN, not-yet-delivered feedback
# into the work backlog (AI-triaged). Idempotent: each item is delivered once.
#
# Activation (maintainer): set repo/environment
#   - Secret    COSMOS_BASE_URL   e.g. https://example.com
#   - Secret    COSMOS_ORG_ID     the target org's UUID
#     SECRETS, not variables: a step's env is printed in the run log, this
#     repository's logs are public, and only a secret's value is masked there.
#   - Secret    COSMOS_API_KEY    an org API key (cosmos_… , scope items:write)
# Until these exist the job no-ops (guards below), so the workflow is inert by
# default. It NEVER merges or deploys — it only asks the app to file work items.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      limit:
        description: "Max feedback items to deliver this run (1-50)"
        required: false
        default: "10"

concurrency:
  group: feedback-remediation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      # The server URL is a secret, but GitHub masks a secret only where its whole
      # value appears, and curl's connection errors print just the host. Masked
      # here, in a step of its own, it is hidden before anything below can print it.
      - name: Mask the server's hostname
        env:
          URL: ${{ secrets.COSMOS_BASE_URL }}
        run: |
          host=${URL#*://}; host=${host%%[/?#]*}; host=${host##*@}; host=${host%%:*}
          if [ -n "$host" ]; then echo "::add-mask::$host"; fi

      - name: Trigger remediation pass
        env:
          BASE_URL: ${{ secrets.COSMOS_BASE_URL }}
          ORG_ID: ${{ secrets.COSMOS_ORG_ID }}
          API_KEY: ${{ secrets.COSMOS_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$ORG_ID" ] || [ -z "$API_KEY" ]; then
            echo "::notice::feedback-remediation not configured (COSMOS_BASE_URL / COSMOS_ORG_ID / COSMOS_API_KEY unset) — skipping."
            exit 0
          fi
          echo "Triggering remediation for org $ORG_ID (limit $LIMIT)…"
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/v1/orgs/$ORG_ID/feedback/remediate" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": $LIMIT}")
          # The outcome only, never the body: this repo is public, so its Actions
          # logs are too, and the body carries per-item triage text (rationale,
          # acceptance criteria) and the org's counts. `|| true`: a body with
          # none of these keys must not abort the step under -eo pipefail.
          outcome=$(grep -o -E '"(skipped|error)":"[a-z_-]*"' /tmp/resp.json | tr '\n' ' ' || true)
          echo "HTTP $code ${outcome}"
          if [ "$code" -ge 300 ]; then
            echo "::error::remediation trigger failed (HTTP $code)"
            exit 1
          fi
