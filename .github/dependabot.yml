# Dependabot — keeps deps, Actions, and base images patched.
# Spec §8 gate 2 (SCA): automated dependency updates feed the SCA gate and the
# 800-171 3.11.2 (flaw remediation) evidence trail. github-actions updates keep
# the SHA-pins current (gate 8); docker keeps the base image patched (gate 4).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Framework packages get their OWN group, even at minor/patch.
      #
      # The rule below batches by SEMVER RANGE, on the reasoning that minor and
      # patch are low risk. That holds for a leaf library and does not hold for
      # the things the whole app is built on: a single `minor-and-patch` PR on
      # 2026-09-14 carried react 19.2.8 -> 19.3.0, next 16.3.4 -> 16.3.5 and
      # @prisma/client 7.9.1 -> 7.10.0 alongside 56 other packages.
      #
      # Groups are all-or-nothing, so one broken member holds every other member
      # hostage. That PR failed on a tensor-type error somewhere in the
      # embedding stack and took 58 unrelated updates down with it — including
      # the security patches this file exists to deliver (see the 800-171
      # 3.11.2 note at the top). Bisecting a 59-package diff to find out which
      # one broke is the cost of batching them in the first place.
      #
      # Split out, each of these arrives as a PR whose failure names its own
      # cause, and the rest of the batch keeps flowing.
      framework:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "prisma"
          - "@prisma/*"
        update-types: ["minor", "patch"]
      # Batch low-risk patch/minor bumps to keep PR noise down; majors stay
      # individual so breaking changes are reviewed in isolation.
      #
      # `exclude-patterns` rather than relying on group order: dependabot's
      # first-match behaviour would do the right thing here, but it is implicit,
      # and someone reordering these groups later should not silently fold the
      # framework back into the batch.
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "react"
          - "react-dom"
          - "next"
          - "prisma"
          - "@prisma/*"
    labels: ["dependencies", "security"]
    ignore:
      # Keep @types/node on the major that matches the Node Active-LTS runtime
      # (currently 24 — see Dockerfile / setup-node). Dependabot otherwise bumps
      # to the newest major (26 = "Current" line, Active LTS ~Oct 2026). Node
      # major upgrades are done deliberately as their own PR, not auto-proposed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hold TypeScript at 6.x until the lint toolchain supports 7.
      #
      # `typescript-eslint` declares `typescript: ">=4.8.4 <6.1.0"`, and no
      # published version — 8.65.x including its alphas, and there is no v9 —
      # accepts 7. eslint-config-next depends on it, so `next lint` dies at
      # config load before it reads a single file:
      #
      #   Error: typescript-eslint does not support TS 7.0.
      #     at node_modules/eslint-config-next/node_modules/typescript-eslint/dist/index.js:52:11
      #
      # That is the whole of why #480 could not merge: not our code, and not
      # fixable here. Re-raising it weekly just re-runs a doomed CI job. Remove
      # this entry once typescript-eslint ships TS 7 support, and take the
      # upgrade deliberately as its own PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pdfkit 0.20.x silently stops rendering the org logo.
      #
      # Measured 2026-09-15 by installing it against this tree:
      # `src/lib/pdf/brand.test.ts` goes 40/40 -> 3 failed, and the failure is
      # the contract assertion that matters —
      #
      #   expect(withLogo.equals(plain)).toBe(false)   // received: true
      #
      # i.e. a PDF generated WITH a logo comes out byte-identical to one
      # generated without. Both the data-URL path and the threaded-bytes path
      # fail, so it is not one call site. Shipping it would quietly drop
      # branding from every generated invoice and audit log.
      #
      # pdfkit is 0.x, where a minor bump is a breaking change by convention,
      # and it is in `serverExternalPackages` (next.config.ts) because its CJS
      # shape does not bundle — so its image handling is exactly the kind of
      # thing that moves underneath us.
      #
      # Held at 0.19.x rather than ignored outright, so patches and any later
      # line still arrive. Remove this once 0.20+ renders the logo again, and
      # re-run brand.test.ts to confirm rather than assuming.
      - dependency-name: "pdfkit"
        versions: ["0.20.x"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci", "security"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker", "security"]
    ignore:
      # Hold the Node base image at the Active-LTS major (currently 24).
      # Dependabot bumps to the newest tag, which tracks the non-LTS "Current"
      # line (26 until ~Oct 2026). Major base-image moves are done deliberately
      # (their own PR); patch/minor of the pinned major still auto-update.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
