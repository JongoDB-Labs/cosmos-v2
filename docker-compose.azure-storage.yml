# Opt-in: keep the app's uploads in Azure Blob Storage instead of MinIO.
#   docker compose -f docker-compose.yml -f docker-compose.azure-storage.yml up -d
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.azure-storage.yml in the
# shell, and add any override file you already use to the same list).
# Put AZURE_STORAGE_CONTAINER and AZURE_STORAGE_ACCOUNT_URL (or
# AZURE_STORAGE_CONNECTION_STRING) in .env; the app reads them through env_file.
# See .env.example. MinIO still runs: it holds the backup and audit buckets. The S3_* settings
# stay set on the app but are not used.
# The container must already exist. A connection string in .env also reaches the
# other services that read .env; prefer the host's identity (account URL).
# Switching an existing install needs a pause in uploads: stop the app, copy its
# objects to the container under the SAME keys, then switch, or files uploaded
# meanwhile (or not copied) will 404.
services:
  cosmos:
    environment:
      STORAGE_ADAPTER: azure
      # prod: skip developer sign-ins (Azure CLI etc.); the host's managed identity,
      # or service-principal settings in .env, are used. Not used with a connection
      # string.
      AZURE_TOKEN_CREDENTIALS: ${AZURE_TOKEN_CREDENTIALS:-prod}
